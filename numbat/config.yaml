name: Numbat — Energy Optimizer
version: 0.17.0
slug: numbat
description: Battery/solar optimizer for Amber Electric dynamic pricing
url: https://github.com/danbitzer/numbat
image: ghcr.io/danbitzer/numbat-{arch}
arch:
  - aarch64
  - amd64
init: true
homeassistant_api: true
hassio_api: false
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-charging
panel_title: Numbat
watchdog: http://[HOST]:[PORT:8099]/health
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
